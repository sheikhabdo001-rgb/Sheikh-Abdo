         This keeps Arabic shaping identical to the on-screen report. -->

<body>
    <!-- Root target used by the exam print renderer. It stays empty and
         invisible on screen until a print template is injected. -->
    <div id="examPrintArea" class="print-only-container" aria-hidden="true"></div>

    <!-- Official Print Header (Hidden on Screen) -->
    <div id="officialPrintHeader" class="print-only cover-page">
        <!-- Watermark Container -->
        <div id="printWatermark" class="print-watermark"></div>

        <div class="print-header-top">
            <div class="print-header-center">
                <h1 id="printDocumentTitle"></h1>
                <div id="printSubTitle" class="print-subtitle"></div>
            </div>
            
            <div class="academy-brand-box">
                <div class="academy-logo-print">
                    <i id="printAcademyIcon" class="fas fa-graduation-cap"></i>
                </div>
                <div class="academy-details">
                    <span class="label">أكاديمية:</span>
                    <strong id="printTeacherName" class="value"></strong>
                </div>
            </div>

            <div class="metadata-box">
                <div class="timestamp-box">
                    <span class="label">تاريخ الاستخراج:</span>
                    <span id="printDate" class="value"></span>
                </div>
                <div class="page-count-box" style="margin-top: 10pt;">
                    <span class="label">رقم الصفحة:</span>
                    <span class="page-number"></span>
                </div>
            </div>
        </div>

        <!-- Smart Analytics Summary Cards for Print -->
        <div id="printSummaryCards" class="print-summary-grid">
            <div class="print-summary-card">
                <span class="card-label">إجمالي الطلاب</span>
                <strong id="printStatTotalStudents" class="card-value">0</strong>
            </div>
            <div class="print-summary-card">
                <span class="card-label">الحالة المالية</span>
                <strong id="printStatFinancial" class="card-value">---</strong>
            </div>
            <div class="print-summary-card">
                <span class="card-label">متوسط الأداء / الحضور</span>
                <strong id="printStatPerformance" class="card-value">---</strong>
            </div>
            <div class="print-summary-card">
                <span class="card-label">الغائبين / الممتنعين</span>
                <strong id="printStatFlagged" class="card-value">0</strong>
            </div>
        </div>
    </div>

    <!-- Dynamic Table Header for Page 2+ (Hidden on Screen) -->
    <div id="printTableHeader" class="print-only table-page-header">
        <h2 id="printTableGradeName"></h2>
    </div>

    <!-- App Container -->
    <div id="app">
        <!-- Login Section -->
        <div id="loginSection" class="login-container">
            <!-- Content injected via js/templates/login-template.js -->
        </div>

        <!-- Dashboard Section -->
        <div id="dashboardSection" class="dashboard page-section" style="display: none;">
            <header id="mainHeader" class="glass-header">
                <!-- Content injected via js/templates/header-template.js -->
            </header>

            <!-- Components Container -->
            <div id="settingsContainer"></div>
            
            <!-- Main Content Area -->
            <div id="viewsContainer">
                <!-- All views (home, students, etc.) injected via js/templates/view-templates.js -->
            </div>

            <!-- Navigation Container -->
            <div id="navContainer"></div>
        </div>
    </div>

    <!-- Floating page navigation control -->
    <button id="scrollToTopBtn" class="scroll-top-btn" title="العودة للأعلى" style="display: none;" aria-label="العودة للأعلى">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>

    <!-- Modals Container -->
    <div id="modalsContainer"></div>

    <!-- Official Print Footer (Repeating on Pages) -->
    <div id="officialPrintFooter" class="print-only print-footer">
        <div class="footer-content">
            <div class="footer-right">نظام إدارة الطلاب الذكي &copy; 2026</div>
            <div class="footer-center">صفحة <span class="page-number"></span></div>
            <div class="footer-left" id="footerTeacherName"></div>
        </div>
        <div class="developer-credit">DEVELOPED BY MAZEN AHMED</div>
    </div>
